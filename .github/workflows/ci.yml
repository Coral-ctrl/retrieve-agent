name: CI

# When it runs: on every push to main, and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: run the full test suite against a real Postgres + pgvector.
  test:
    runs-on: ubuntu-latest

    # A "service" is a container GitHub starts next to your job.
    # It's the same image as in your docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retrieve_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the tests start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # This is the variable test_db_integration.py reads to find the database.
    env:
      RETRIEVE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retrieve_test

    steps:
      - uses: actions/checkout@v4 # get your code
      - uses: actions/setup-python@v5 # same Python as your Mac
        with:
          python-version: "3.13"
          cache: pip # reuse downloaded packages between runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs # -rs prints the reason for any skipped test

  # Job 2: prove the Docker setup still works. It runs at the same time as job 1.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet # is docker-compose.yml valid?
      - run: docker build -t retrieve . # does the image still build?
